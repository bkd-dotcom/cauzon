[project]
name = "cauzon-datahub"
version = "0.1.0"
description = "Cauzon — a path-grounded root-cause agent for data incidents on DataHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real DataHub hookup. Not needed for the mock demo.
datahub = ["datahub-agent-context>=0.1", "acryl-datahub>=1.6"]
dev = ["pytest>=8.0"]

[project.scripts]
cauzon = "cauzon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/cauzon"]

[tool.pytest.ini_options]
pythonpath = ["agent"]
testpaths = ["tests"]
