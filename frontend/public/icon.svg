<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- rounded app background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- lineage path: three nodes, symptom -> mid -> root -->
  <g stroke="#26305a" stroke-width="10" fill="none" stroke-linecap="round">
    <line x1="150" y1="360" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="362" y2="152"/>
  </g>

  <!-- symptom node (amber) -->
  <circle cx="150" cy="360" r="26" fill="#0b1020" stroke="#fbbf24" stroke-width="10"/>
  <!-- intermediate node -->
  <circle cx="256" cy="256" r="22" fill="#0b1020" stroke="#6ea8fe" stroke-width="9"/>
  <!-- root cause node (red, filled) -->
  <circle cx="362" cy="152" r="30" fill="#f87171" stroke="#0b1020" stroke-width="8"/>

  <!-- magnifying glass focused on the root cause -->
  <g stroke="url(#accent)" stroke-width="26" fill="none" stroke-linecap="round">
    <circle cx="362" cy="152" r="86"/>
    <line x1="424" y1="214" x2="470" y2="260"/>
  </g>
</svg>
